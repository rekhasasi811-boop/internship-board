<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Internship Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="container">
      <h1>Explore Internships</h1>
      <p>Find your next opportunity across tech, design, and business.</p>
    </div>
  </header>

  <main class="container">
    <section class="filter-section" aria-label="Internship Filters">
      <div class="field-group">
        <label for="search-input">Search Title or Company</label>
        <input
          type="search"
          id="search-input"
          placeholder="e.g. Java Developer, UI Designer..."
          aria-describedby="search-hint"
        />
        <span id="search-hint" class="sr-only">Type to filter internships by title or company name</span>
      </div>

      <div class="field-group">
        <label for="domain-select">Filter by Domain</label>
        <select id="domain-select">
          <option value="all">All Domains</option>
          <option value="Engineering">Engineering</option>
          <option value="Design">Design</option>
          <option value="Product">Product</option>
          <option value="Marketing">Marketing</option>
        </select>
      </div>
    </section>

    <div id="status-message" class="sr-only" aria-live="polite"></div>

    <section id="internships-container" class="cards-grid" aria-label="Internship Listings">
    </section>

    <div id="empty-state" class="state-box hidden">
      <h3>No internships found</h3>
      <p>Try adjusting your search terms or clearing domain filters.</p>
      <button id="reset-btn" type="button">Reset Filters</button>
    </div>

    <div id="error-state" class="state-box error hidden">
      <h3>Something went wrong</h3>
      <p>Unable to load internship data at this moment.</p>
      <button id="retry-btn" type="button">Try Again</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
